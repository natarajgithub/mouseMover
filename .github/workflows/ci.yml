# Cloud-runnable checks for usb-hid-s3 + Mouse Mover iOS (no physical board).
# On-device pytest (integration, HID E2E, WiFi, BLE, mDNS) stays local-only.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Native unit tests + firmware build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: usb-hid-s3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/penv
          key: pio-${{ runner.os }}-${{ hashFiles('usb-hid-s3/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio
          # pioarduino ships esptool 5.0.0-dev1, which breaks on click>=8.2
          # (ParamType.get_metavar requires ctx). Pin until tool-esptoolpy updates.
          pip install "click>=8.1.7,<8.2"

      - name: Native unit tests (no hardware)
        run: pio test -e native -v

      - name: Build esp32s3 firmware
        run: pio run -e esp32s3

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: usb-hid-s3-esp32s3-${{ github.sha }}
          path: |
            usb-hid-s3/.pio/build/esp32s3/firmware.bin
            usb-hid-s3/.pio/build/esp32s3/bootloader.bin
            usb-hid-s3/.pio/build/esp32s3/partitions.bin
          if-no-files-found: error
          retention-days: 14

  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: usb-hid-s3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate openapi.yaml parses as YAML + OpenAPI 3
        run: |
          pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("docs/openapi.yaml")
          doc = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert isinstance(doc, dict), "root must be a mapping"
          assert str(doc.get("openapi", "")).startswith("3."), f"expected OpenAPI 3.x, got {doc.get('openapi')!r}"
          assert "paths" in doc and doc["paths"], "paths must be non-empty"
          assert "info" in doc and doc["info"].get("title"), "info.title required"
          required = [
              "/api/status",
              "/api/jiggle",
              "/api/move",
              "/api/type",
              "/api/key",
              "/api/click",
              "/api/wifi",
              "/api/wifi/clear",
          ]
          missing = [p for p in required if p not in doc["paths"]]
          assert not missing, f"missing paths: {missing}"
          print(f"OK: {path} openapi={doc['openapi']} paths={len(doc['paths'])}")
          PY

  ios:
    name: iOS build + unit tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for iOS project
        id: guard
        run: |
          if [ -f ios/MouseMover.xcodeproj/project.pbxproj ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ios/ companion not in this commit; skipping iOS job steps."
          fi

      - name: Show Xcode version
        if: steps.guard.outputs.present == 'true'
        run: xcodebuild -version

      - name: Resolve iOS Simulator destination
        if: steps.guard.outputs.present == 'true'
        id: sim
        run: |
          set -euo pipefail
          name="$(python3 - <<'PY'
          import json, subprocess, sys

          data = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              )
          )
          preferred = [
              "iPhone 16",
              "iPhone 17",
              "iPhone 15",
              "iPhone SE (3rd generation)",
          ]
          available = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and str(device.get("name", "")).startswith("iPhone"):
                      available.append(device["name"])

          # Prefer a known name, else first unique iPhone.
          seen = []
          for n in available:
              if n not in seen:
                  seen.append(n)
          for name in preferred:
              if name in seen:
                  print(name)
                  sys.exit(0)
          if seen:
              print(seen[0])
              sys.exit(0)
          sys.stderr.write("No available iPhone simulator\n")
          sys.exit(1)
          PY
          )"
          echo "destination=platform=iOS Simulator,name=${name}" >> "$GITHUB_OUTPUT"
          echo "Using simulator: ${name}"

      - name: Build and test Mouse Mover
        if: steps.guard.outputs.present == 'true'
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild test \
            -project MouseMover.xcodeproj \
            -scheme MouseMover \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/MouseMoverDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Android project
        id: guard
        run: |
          if [ -f android/settings.gradle.kts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "android/ companion not in this commit; skipping Android job steps."
          fi

      - name: Set up JDK 17
        if: steps.guard.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.guard.outputs.present == 'true'
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        if: steps.guard.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Unit tests + assembleDebug
        if: steps.guard.outputs.present == 'true'
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
