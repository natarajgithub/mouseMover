; USB HID Mouse+Keyboard on ESP32-S3 (ESP32 core native USB: CDC + HID)
; See docs/PHASE_LOG.md for build/test history.

[platformio]
default_envs = esp32s3

; ---------------------------------------------------------------------------
; On-device firmware build (ESP32-S3, native USB-OTG via the ESP32 core stack)
; ---------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; --- Waveshare ESP32-S3-Zero (4 MB flash) ---
; Default esp32-s3-devkitc-1 profile assumes 8 MB and boot-loops on 4 MB parts.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = max_app_4MB.csv
board_build.arduino.memory_type = qio_qspi

; --- USB mode: native USB-OTG using the ESP32 core's own USB stack ---
; The esp32-s3-devkitc-1 board manifest hard-codes -DARDUINO_USB_MODE=1 in its
; build.extra_flags, and pioarduino appends it AFTER build_unflags, so a plain
; unflag/override loses (=1 wins, Serial binds to USB-Serial-JTAG and the OTG
; HID never enumerates). We therefore REPLACE the board's extra_flags entirely,
; forcing ARDUINO_USB_MODE=0 (native USB-OTG).
;   ARDUINO_USB_MODE=0        -> USB-OTG, NOT the hardware USB-Serial-JTAG unit
;   ARDUINO_USB_CDC_ON_BOOT=0 -> the core does NOT auto-run USB.begin() at boot.
;     (With =1 the core calls USB.begin() before setup() using the default VID/
;      PID and no HID; ESPUSB::begin() only inits TinyUSB once, so our custom
;      identity + HID never take effect.) We own the whole bring-up in setup()
;      and log over an explicit USBCDC (UsbSerial) instead of the boot Serial.
; USE_TINYUSB (Adafruit) is intentionally NOT set: with the core USBCDC it broke
; serial RX (the CDC OUT endpoint); we use the core's integrated USBHID+USBCDC.
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=1
    -I include

; esp-idf-size 2.x removed --ng; the espressif32 platform still passes it.
extra_scripts = pre:scripts/ensure_idf_size_compat.py

lib_deps =
    h2zero/NimBLE-Arduino @ ^2.5.0

; ---------------------------------------------------------------------------
; Host-side unit tests for pure logic in lib/ (no Arduino/USB dependencies).
; Run with: pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -D UNIT_TEST
    -std=gnu++17
build_src_filter =
    -<*>
